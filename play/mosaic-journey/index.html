<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,height=device-height,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <meta name="theme-color" content="#18383e">
    <title>Mosaic Journey</title>
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <main id="unity-container">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <section id="unity-loading" aria-live="polite">
        <strong>MOSAIC JOURNEY</strong>
        <span id="loading-status">Opening your travel album</span>
        <div id="progress-track"><div id="progress-fill"></div></div>
      </section>
      <div id="unity-warning"></div>
    </main>
    <script>
      const canvas = document.querySelector('#unity-canvas');
      const loading = document.querySelector('#unity-loading');
      const loadingStatus = document.querySelector('#loading-status');
      const progress = document.querySelector('#progress-fill');
      const warning = document.querySelector('#unity-warning');
      const bootStartedAt = performance.now();
      let lastMilestone = 0;

      function reportBoot(phase, detail = '') {
        const elapsedMs = Math.round(performance.now() - bootStartedAt);
        console.log(`MOSAIC_BOOT phase=${phase} elapsedMs=${elapsedMs}${detail ? ` ${detail}` : ''}`);
      }

      function updateLoadingStatus(value) {
        if (value < 0.2) loadingStatus.textContent = 'Opening your travel album';
        else if (value < 0.65) loadingStatus.textContent = 'Collecting postcard pieces';
        else if (value < 0.9) loadingStatus.textContent = 'Arranging the puzzle table';
        else loadingStatus.textContent = 'Polishing the final details';

        const milestone = Math.min(100, Math.floor(value * 4) * 25);
        if (milestone > lastMilestone) {
          lastMilestone = milestone;
          reportBoot('progress', `progress=${milestone}`);
        }
      }

      function unityShowBanner(message, type) {
        const item = document.createElement('div');
        item.textContent = message;
        item.className = type || 'info';
        warning.appendChild(item);
        warning.style.display = 'block';
        if (type !== 'error') setTimeout(() => item.remove(), 5000);
      }

      const buildUrl = 'Build';
      const loaderUrl = buildUrl + '/WebGL.loader.js';
      const config = {
        arguments: [],
        dataUrl: buildUrl + '/WebGL.data.unityweb',
        frameworkUrl: buildUrl + '/WebGL.framework.js.unityweb',
        codeUrl: buildUrl + '/WebGL.wasm.unityweb',
        streamingAssetsUrl: 'StreamingAssets',
        companyName: "Parity Lab",
        productName: "Mosaic Journey",
        productVersion: "0.4.0",
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 3),
        autoSyncPersistentDataPath: true,
        showBanner: unityShowBanner
      };

      const script = document.createElement('script');
      script.src = loaderUrl;
      script.onload = () => {
        reportBoot('loader-ready');
        createUnityInstance(canvas, config, value => {
          progress.style.width = `${Math.round(value * 100)}%`;
          updateLoadingStatus(value);
        }).then(() => {
          loading.classList.add('hidden');
          canvas.focus();
          reportBoot('interactive');
        }).catch(message => {
          reportBoot('failed');
          unityShowBanner(message, 'error');
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
