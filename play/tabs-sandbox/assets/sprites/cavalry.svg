<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <!-- 骑兵: 马+骑士 -->
  <!-- 马身 -->
  <ellipse cx="20" cy="26" rx="14" ry="6" fill="#7A5A3A" stroke="#000" stroke-width="1"/>
  <!-- 马头 -->
  <rect x="30" y="20" width="8" height="5" fill="#7A5A3A" stroke="#000" stroke-width="1"/>
  <!-- 马腿 -->
  <rect x="8" y="30" width="2" height="8" fill="#4A3020" stroke="#000" stroke-width="0.5"/>
  <rect x="14" y="30" width="2" height="8" fill="#4A3020" stroke="#000" stroke-width="0.5"/>
  <rect x="24" y="30" width="2" height="8" fill="#4A3020" stroke="#000" stroke-width="0.5"/>
  <rect x="30" y="30" width="2" height="8" fill="#4A3020" stroke="#000" stroke-width="0.5"/>
  <!-- 骑士 -->
  <circle cx="20" cy="10" r="4" fill="#AAB5B8" stroke="#000" stroke-width="1"/>
  <rect x="17" y="13" width="6" height="10" fill="#9AA5A8" stroke="#000" stroke-width="1"/>
  <!-- 剑 -->
  <line x1="26" y1="8" x2="38" y2="4" stroke="#CCC" stroke-width="1.5"/>
  <rect x="36" y="3" width="3" height="2" fill="#FFD700" stroke="#000" stroke-width="0.5"/>
</svg>
