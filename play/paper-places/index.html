<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Paper Places</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="paper-loading-title">Paper Places</div><svg id="paper-loading-sprig" viewBox="0 0 64 64" aria-hidden="true"><path d="M13 52Q30 32 50 12" stroke="currentColor" fill="none" stroke-width="2"/><path d="M24 40Q5 37 14 23Q29 24 24 40M34 30Q17 19 29 10Q40 15 34 30M38 28Q42 8 58 14Q54 29 38 28M26 41Q38 28 48 37Q42 49 26 41" fill="currentColor"/></svg><div id="paper-loading-copy" role="status">正在展开一个小小世界…</div><div id="paper-loading-note" hidden></div><button id="paper-loading-retry" type="button" hidden>重新加载</button>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Paper Places</div>
      </div>
    </div>
    <script>
      const paperZh = (navigator.language || '').toLowerCase().startsWith('zh');
const paperCopy = document.getElementById('paper-loading-copy');
const paperNote = document.getElementById('paper-loading-note');
const paperRetry = document.getElementById('paper-loading-retry');
paperCopy.textContent = paperZh ? '正在展开一个小小世界…' : 'Unfolding a little place…';
paperRetry.textContent = paperZh ? '重新加载' : 'Reload';
paperRetry.addEventListener('click', () => window.location.reload());
const paperProgress = document.getElementById('unity-progress-bar-empty');
paperProgress.setAttribute('role','progressbar');
paperProgress.setAttribute('aria-label',paperZh?'加载进度':'Loading progress');
paperProgress.setAttribute('aria-valuemin','0');paperProgress.setAttribute('aria-valuemax','100');
window.paperShowLoadFailure = (reason) => {
 document.getElementById('unity-loading-bar').style.display='block';
 paperCopy.setAttribute('role','alert');
 paperCopy.textContent = paperZh ? '这个小小世界暂时没能展开。' : 'This little place could not open.';
 paperNote.textContent = paperZh ? '请重试，继续你的旅程。' : 'Try again to continue your journey.';
 paperNote.hidden=false;paperRetry.hidden=false;paperProgress.style.display='none';
 console.error('Paper Places loading failed:',reason);
};
var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) { if(type === 'error'){window.paperShowLoadFailure(msg); return;}
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/dist.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/dist.data.unityweb",
        frameworkUrl: buildUrl + "/dist.framework.js.unityweb",
        codeUrl: buildUrl + "/dist.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Paper Places Studio",
        productName: "Paper Places",
        productVersion: "0.3.0",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl; script.onerror = () => window.paperShowLoadFailure('loader unavailable');
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%"; paperProgress.setAttribute('aria-valuenow', Math.round(100 * progress));
              }).then((unityInstance) => { window.__unity = unityInstance; window.__paperUnityReadyAt = performance.now();
                document.querySelector("#unity-loading-bar").style.display = "none";
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                window.paperShowLoadFailure(message);
              });
            };

      document.body.appendChild(script);

    </script>
  
<style id="clikit-fullviewport">
html,body{margin:0!important;padding:0!important;height:100%!important;background:#f4eee3!important;overflow:hidden!important;overscroll-behavior:none}
#unity-container,.unity-desktop,.unity-mobile{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;height:100dvh!important;left:0!important;top:0!important;transform:none!important}
#unity-canvas{width:100vw!important;height:100vh!important;height:100dvh!important;display:block!important;background:#f4eee3!important;touch-action:none}
#unity-footer,#unity-fullscreen-button,#unity-build-title,#unity-webgl-logo{display:none!important}
#unity-loading-bar{z-index:10;width:270px!important;text-align:center;color:#315c58} #unity-logo{display:none!important}
#unity-loading-bar{width:min(310px,calc(100vw - 64px))!important;color:#665548!important;font-family:system-ui,sans-serif}
#paper-loading-title{font:40px Georgia,serif;margin-bottom:26px;color:#285956}
#paper-loading-sprig{width:58px;height:58px;margin:0 auto 32px;color:#be9253}
#paper-loading-copy{font:16px/1.65 system-ui,sans-serif;margin-bottom:24px}
#paper-loading-note{font:14px/1.6 system-ui,sans-serif;margin:0 0 24px}
#unity-progress-bar-empty{width:100%!important;height:7px!important;background:#ded5c7!important;border-radius:4px;margin:0!important;overflow:hidden}
#unity-progress-bar-full{height:7px!important;background:#285956!important;border-radius:4px;margin:0!important}
#paper-loading-retry{min-height:54px;width:100%;border:0;border-radius:7px;background:#285956;color:#fffcf6;font:16px system-ui,sans-serif;cursor:pointer}
#paper-loading-retry:focus-visible{outline:3px solid #be9253;outline-offset:4px}
</style></body>
</html>
