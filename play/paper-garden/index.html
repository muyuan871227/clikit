<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Paper Garden</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eee8dc}body{display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;color:#674b30}#garden{position:relative;width:min(100vw,56.3077dvh);height:min(100dvh,177.5956vw);overflow:hidden;box-shadow:0 8px 40px #674b3022}canvas{width:100%;height:100%;display:block;outline:none;touch-action:none;-webkit-user-select:none;user-select:none}#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f8f1e3;gap:18px;text-align:center;padding:26px}h1{font-size:36px;font-weight:normal;margin:0}p{font-family:system-ui,sans-serif;font-size:14px;line-height:1.6;margin:0}progress{width:180px;accent-color:#8b9d72}#retry{font:inherit;padding:12px 26px;border:1px solid #b5a68f;border-radius:16px;background:#e3e8ce;color:#674b30}#pg-evidence{display:none}</style></head>
<body><main id="garden"><canvas id="unity-canvas" tabindex="0" aria-label="Paper Garden puzzle. Click or tap a clear paper path to slide it out."></canvas><section id="loading" aria-live="polite"><h1>Paper Garden</h1><p id="status">Preparing your garden…</p><progress id="progress" value="0" max="1"></progress><button id="retry" hidden onclick="location.reload()">Try again</button></section></main><output id="pg-evidence" aria-hidden="true"></output><output id="pg-browser-input" hidden></output>
<script src="study-recorder.js"></script>
<script>
const canvas=document.querySelector('#unity-canvas'),loading=document.querySelector('#loading'),statusText=document.querySelector('#status');
// Study-only controls remain outside the shipped game canvas and normal player flow.
if(window.pgStudyRecorder.status().enabled){
 const controls=document.createElement('aside');controls.id='study-controls';controls.style.cssText='position:fixed;right:6px;bottom:4px;z-index:20;font:11px system-ui;color:#674b30;background:#fff9;border-radius:8px;padding:4px;max-width:150px';
 const note=document.createElement('span');note.id='study-recording-status';note.setAttribute('role','status');note.style.cssText='display:block;font-size:10px';
 const download=document.createElement('button');download.id='export-study-log';download.textContent='Export study log';download.style.cssText='font:inherit;border:1px solid #b5a68f;border-radius:6px;background:#f8f1e3;color:#674b30;padding:5px';
 download.onclick=()=>{const raw=window.pgStudyRecorder.exportJSON();const report=JSON.parse(raw);const link=document.createElement('a');const url=URL.createObjectURL(new Blob([raw],{type:'application/json'}));link.href=url;link.download='paper-garden-'+report.record.orderId+'-'+report.record.slot+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
 controls.append(note,download);document.body.append(controls);
 window.pgStudyRefreshStatus=()=>{const s=window.pgStudyRecorder.status();note.textContent=s.halted?'Recording stopped — export now':s.issues.length?'Recording warning — export to review':'QA recording · '+s.eventCount+' events';note.style.color=s.halted?'#a02020':'#674b30';};window.pgStudyRefreshStatus();
}

if(new URLSearchParams(location.search).get('qa')==='1'){const input=[];for(const type of ['pointerdown','pointerup','pointercancel','touchstart','touchend','touchcancel'])canvas.addEventListener(type,event=>{if(window.pgStudyRecordPointer)window.pgStudyRecordPointer(event);input.push({type:event.type,trusted:event.isTrusted,pointerType:event.pointerType||'touch',pointerId:event.pointerId,changedTouches:event.changedTouches?Array.from(event.changedTouches,t=>({id:t.identifier,x:t.clientX,y:t.clientY})):undefined,x:event.clientX,y:event.clientY,at:performance.now()});if(input.length>200)input.shift();document.querySelector('#pg-browser-input').textContent=JSON.stringify(input);},{passive:true});}
function fail(message){loading.style.display='flex';statusText.textContent='Your garden could not open. Please try again.';document.querySelector('#progress').hidden=true;document.querySelector('#retry').hidden=false;console.error(message);}
const script=document.createElement('script');script.src='Build/61fa913e972060dba0a80d65a2530853.loader.js';script.onerror=()=>fail('Loader unavailable');script.onload=()=>{
createUnityInstance(canvas,{dataUrl:'Build/88024d0f48d1546c5127bfe821689500.data',frameworkUrl:'Build/92a5991c438b9c4515ced513b9fe5c55.framework.js',codeUrl:'Build/287916fdad2fe6b83bc1e8db3d10b703.wasm',streamingAssetsUrl:'StreamingAssets',companyName:'Ploof Games',productName:'Paper Garden',productVersion:'0.1.0',devicePixelRatio:Math.min(window.devicePixelRatio||1,2),matchWebGLToCanvasSize:true,showBanner:(message,type)=>{if(type==='error')fail(message);else console.warn(message);}},value=>document.querySelector('#progress').value=value).then(instance=>{window.gardenInstance=instance;loading.style.display='none';canvas.focus();}).catch(fail);
};document.body.appendChild(script);
</script></body></html>
