// ═══ 事件系统 ═════════════════════════════════════════
let evs=[];

function loadDay(d){
  const dd=DAYS.days.find(x=>x.day===d);
  if(!dd){if(d>20)goEnd();return}
  evs=dd.events.slice();evIdx=0;wfc=false;
  dog.tx=.5;dog.ly=false;dog.st='idle';dog.ea=0;
  if(d>1)hope=cl(hope-2,1,100);
  dog.ts=hb(hope).ts;showEv();
}

function showEv(){
  if(evIdx>=evs.length){
    if(day>=20){goEnd();return}
    dayTr=true;fadeT=1;
    setTimeout(()=>{day++;loadDay(day);fadeT=0},2000);
    setTimeout(()=>dayTr=false,3500);return;
  }
  const ev=evs[evIdx];txt=ev.desc||'';txtT=1;
  if(ev.hope_change)hope=cl(hope+ev.hope_change,1,100);
  dog.ts=hb(hope).ts;

  if(ev.type==='door_sound'){
    stat.door++;stat.sniff++;dog.tx=ZN.door+.05;dog.dir=-1;
    dog.st=hope>40?'run':'walk';dog.ea=1;sfxHeart();
    setTimeout(()=>{dog.ea=-1;dog.st='idle';sfxSigh();
      setTimeout(()=>{dog.ea=0;dog.dir=1;dog.tx=.4},1500)},2500);
  }else if(ev.type==='visitor'){dog.tx=ZN.entry;dog.st='walk';dog.dir=-1;
  }else if(ev.type==='discovery'){dog.st='sniff';stat.sniff++;
    setTimeout(()=>{if(dog.st==='sniff')dog.st='idle'},2000);
  }else if(ev.type==='sleep'){dog.ly=true;
    dog.st=(ev.item_to_sleep==='sweater'||ev.item_to_sleep==='all_items')?'curl_up':'lie_down';
    dog.tx=['doormat','slipper','slipper_pieces','blanket'].includes(ev.item_to_sleep)?ZN.door+.07:ZN.sofa+.06;
  }else if(ev.type==='routine'&&ev.time==='morning'){
    dog.tx=ZN.door+.05;dog.dir=-1;dog.st='walk';stat.sniff++;
  }

  // 物品记忆触发
  if(ev.items){for(const id of ev.items){
    const it=ITEMS.items.find(i=>i.id===id);if(it?.memory_trigger){
      const m=MEM.memories.find(x=>x.id===it.memory_trigger);
      if(m){const sc=Math.max(0,(it.scent_initial||0)-(it.scent_decay_per_day||0)*(day-(it.day_available||1)));
        if(sc>10)setTimeout(()=>trigMem(m),3000)}}}}
  wfc=true;autoT=0;
}

function trigMem(m){mFlash=m;mT=0;spG(dog.x*W,H*FY-20);sfxChime()}
function goEnd(){phase=3;eStep=0;eT=0;stopClock();sfxDoor()}

// ═══ 输入 ═════════════════════════════════════════════
function click(mx,my){
  iA();sfxClick();
  if(phase===0){
    if(my<H*.75){
      if(phase!==0)return; // 防止重复点击
      phase=2;fadeT=1;startClock();
      setTimeout(()=>{phase=1;day=1;hope=100;stat={door:0,sniff:0};
        dog.x=.5;dog.tx=.5;dog.dir=1;dog.st='idle';dog.ly=false;dog.ts=6;dog.ea=0;
        loadDay(1);fadeT=0},800)}return; // 缩短过渡时间
  }
  if(phase===3&&eStep===3&&eT>8000){phase=0;stopClock();return}
  if(phase===1&&wfc&&!dayTr){txtT=0;wfc=false;setTimeout(()=>{evIdx++;showEv()},500);return}
  if(phase===1&&!wfc&&!dayTr){
    const fy=H*FY,cr=mx/W;
    // 物品点击→回忆
    const zones=[{z:ZN.door+.06,id:'slipper',ok:day<12},{z:ZN.door+.05,id:'slipper_pieces',ok:day>=12},
      {z:ZN.sofa+.08,id:'sweater',ok:day>=7},{z:ZN.table+.02,id:'photo_frame',ok:day>=5},
      {z:ZN.sofa-.02,id:'tennis_ball',ok:true},{z:ZN.kitchen,id:'food_bowl',ok:true}];
    for(const z of zones){
      if(z.ok&&Math.abs(cr-z.z)<.04&&my>fy-80&&!mFlash){
        const it=ITEMS.items.find(i=>i.id===z.id);
        if(it?.memory_trigger){const m=MEM.memories.find(x=>x.id===it.memory_trigger);
          if(m){dog.tx=z.z;dog.st='sniff';dog.ly=false;stat.sniff++;
            const sc=Math.max(0,(it.scent_initial||0)-(it.scent_decay_per_day||0)*(day-(it.day_available||1)));
            if(sc>5)setTimeout(()=>trigMem(m),1000);return}}}}
    // 移动狗
    if(my>fy-100){dog.tx=cl(mx/W,.05,.95);dog.ly=false;dog.st='walk';
      if(Math.abs(mx/W-ZN.door)<.06){stat.door++;stat.sniff++;dog.dir=-1;dog.st=hope>60?'run':'walk'}}
  }
}
cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect();click(e.clientX-r.left,e.clientY-r.top)});
cv.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0],r=cv.getBoundingClientRect();click(t.clientX-r.left,t.clientY-r.top)},{passive:false});

// ═══ 游戏循环 ═════════════════════════════════════════
let lt=performance.now(),pst=0;
function loop(now){
  const dt=Math.min(50,now-lt);lt=now;

  // 狗移动
  const dx=dog.tx-dog.x;
  if(Math.abs(dx)>.003){const sp=(dog.st==='run'?hb(hope).sp*2.5:hb(hope).sp*1.2)*.001;
    dog.x+=Math.sign(dx)*sp*dt;dog.dir=dx>0?1:-1;
    if(!dog.ly)dog.st=Math.abs(dx)>.08&&hope>50?'run':'walk';
  }else if(dog.st==='walk'||dog.st==='run')dog.st=dog.ly?(dog.st==='curl_up'?'curl_up':'lie_down'):'idle';

  if(dog.ea>.05)dog.ea-=.001*dt;if(dog.ea<-.05)dog.ea+=.0005*dt;
  txtA=lp(txtA,txtT,.2);fadeA=lp(fadeA,fadeT,.1);
  if(mFlash){mT+=dt;if(mT>mFlash.duration_ms){mFlash=null;mT=0}}
  if(phase===3)eT+=dt;
  if(wfc&&fadeA<.1){autoT+=dt;if(autoT>7000){autoT=0;txtT=0;wfc=false;setTimeout(()=>{evIdx++;showEv()},500)}}
  pst+=dt;if(phase===1&&pst>1800){pst=0;spP(sn(day))}
  upP(dt);

  // 渲染
  cx.clearRect(0,0,W,H);
  if(phase===0)drTitle();
  else if(phase===1||phase===2){drBg();drP();drDog();drHUD();if(mFlash)drMem();drFade();drTxt()}
  else if(phase===3)drEnd();

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
