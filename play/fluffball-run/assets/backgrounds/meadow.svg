<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 毡布质感滤镜 -->
    <filter id="feltTexture" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="white" surfaceScale="2">
        <feDistantLight azimuth="45" elevation="60" />
      </feDiffuseLighting>
      <feComposite operator="arithmetic" k1="0.8" k2="0.4" k3="0" k4="0" in2="SourceGraphic" />
    </filter>
    
    <!-- 云朵图形 -->
    <symbol id="cloud" viewBox="0 0 200 120">
      <circle cx="60" cy="70" r="40" fill="white" />
      <circle cx="100" cy="50" r="50" fill="white" />
      <circle cx="150" cy="75" r="35" fill="white" />
    </symbol>

    <!-- 小花图形 -->
    <symbol id="flower" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="6" fill="#FFF176" />
      <circle cx="20" cy="8" r="8" fill="white" opacity="0.9" />
      <circle cx="20" cy="32" r="8" fill="white" opacity="0.9" />
      <circle cx="8" cy="20" r="8" fill="white" opacity="0.9" />
      <circle cx="32" cy="20" r="8" fill="white" opacity="0.9" />
    </symbol>
  </defs>

  <!-- 天空部分 (1/3) -->
  <rect width="1080" height="640" fill="#E8F4FD" />
  
  <!-- 云朵 -->
  <g opacity="0.8">
    <use href="#cloud" x="100" y="150" width="250" />
    <use href="#cloud" x="600" y="80" width="300" />
    <use href="#cloud" x="800" y="300" width="180" />
  </g>

  <!-- 草地部分 (2/3) -->
  <rect y="640" width="1080" height="1280" fill="#C8E6C9" />
  
  <!-- 分界线缝线效果 -->
  <line x1="0" y1="640" x2="1080" y2="640" stroke="#A5D6A7" stroke-width="8" stroke-dasharray="20,15" />

  <!-- 散落的小花 -->
  <g>
    <use href="#flower" x="150" y="800" width="40" />
    <use href="#flower" x="400" y="1200" width="35" />
    <use href="#flower" x="800" y="950" width="45" />
    <use href="#flower" x="250" y="1500" width="30" />
    <use href="#flower" x="700" y="1650" width="40" />
    <use href="#flower" x="900" y="1300" width="38" />
  </g>

  <!-- 全局质感覆盖 -->
  <rect width="1080" height="1920" fill="transparent" filter="url(#feltTexture)" pointer-events="none" />
</svg>