<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Guilty Party 有罪派对</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #0a0d14;
    color: #e8e8f0;
    font-family: 'PingFang SC', 'Helvetica Neue', sans-serif;
    overflow: hidden;
    user-select: none;
  }
  #app {
    position: relative;
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  #game-canvas {
    background: #1a1d2e;
    image-rendering: pixelated;
    cursor: default;
    box-shadow: 0 0 40px rgba(0,0,0,0.6);
    border-radius: 8px;
  }
  #ui-overlay {
    position: absolute;
    top: 0; left: 0;
    pointer-events: none;
    width: 100%; height: 100%;
  }
  .ui-panel { pointer-events: auto; }
  #loading {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #FFD700;
    font-size: 24px;
    letter-spacing: 4px;
  }
  #loading.hidden { display: none; }
  .menu-btn {
    background: linear-gradient(180deg, #2d3142 0%, #1a1d2e 100%);
    color: #FFD700;
    border: 2px solid #FFD700;
    padding: 14px 38px;
    font-size: 18px;
    margin: 8px;
    border-radius: 6px;
    cursor: pointer;
    letter-spacing: 2px;
    transition: all 0.2s;
  }
  .menu-btn:hover {
    background: linear-gradient(180deg, #3d4156 0%, #2a2d3e 100%);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(255,215,0,0.3);
  }
  .menu-btn.danger { color: #FF6B6B; border-color: #FF6B6B; }
  .menu-btn.danger:hover { box-shadow: 0 4px 12px rgba(255,107,107,0.3); }
</style>
</head>
<body>
<div id="app">
  <canvas id="game-canvas" width="960" height="720"></canvas>
  <div id="ui-overlay"></div>
  <div id="loading">LOADING…</div>
</div>

<script>window.__v = Date.now();</script>
<script>
  const _scripts = ['event_bus','utils','game_data','audio_system','sprites','map_system','render_system','input_system','player_manager','evidence_system','trial_system','voting_system','ai_system','ui_system','game_state','main'];
  (async () => {
    for (const s of _scripts) {
      await new Promise((res, rej) => {
        const el = document.createElement('script');
        el.src = `src/${s}.js?v=${window.__v}`;
        el.onload = res; el.onerror = rej;
        document.body.appendChild(el);
      });
    }
  })();
</script>
</body>
</html>
