<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>归途 — The Way Home</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #2C2C2C; }

#game-canvas {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  image-rendering: auto;
}

/* ===== UI Overlay ===== */
#ui-layer {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; font-family: 'Noto Serif SC', 'ZCOOL XiaoWei', serif;
  color: #3E2723;
}
#ui-layer > * { pointer-events: auto; }

/* HUD */
#hud {
  position: absolute; top: 0; left: 0; width: 100%; padding: 12px 20px;
  display: none; pointer-events: none;
}
#hud-day {
  font-family: 'Ma Shan Zheng', cursive; font-size: 22px; color: #EFEBE9;
  text-shadow: 1px 1px 4px rgba(0,0,0,0.6);
}
#hud-weather {
  font-size: 14px; color: #EFEBE9cc; margin-left: 8px;
  text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
}
#hud-supplies {
  position: absolute; left: 20px; bottom: 20px; display: flex; gap: 14px;
}
.supply-item {
  display: flex; align-items: center; gap: 4px;
  background: rgba(62,39,35,0.6); padding: 4px 10px; border-radius: 12px;
  color: #EFEBE9; font-size: 14px; backdrop-filter: blur(4px);
}
.supply-icon { font-size: 18px; }
.supply-flash { animation: flash 0.4s ease; }
@keyframes flash { 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.3); color:#FFB300; } }

#hud-companions {
  position: absolute; right: 20px; bottom: 20px; display: flex; gap: 8px;
}
.companion-avatar {
  width: 40px; height: 40px; border-radius: 50%;
  border: 2px solid #EFEBE9; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; background: rgba(62,39,35,0.6);
  backdrop-filter: blur(4px); transition: transform 0.2s;
}
.companion-avatar:hover { transform: scale(1.15); }

/* Stamina bar */
#hud-stamina {
  position: absolute; left: 20px; bottom: 60px;
  width: 100px; height: 4px; background: rgba(0,0,0,0.3);
  border-radius: 2px;
}
#stamina-fill {
  height: 100%; background: #7CB342; border-radius: 2px;
  transition: width 0.5s ease;
}

/* Main Menu */
#main-menu {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: linear-gradient(180deg, #EFEBE9 0%, #BCAAA4 40%, #8D8D8D 100%);
}
#menu-title {
  font-family: 'Ma Shan Zheng', cursive; font-size: 72px; color: #3E2723;
  margin-bottom: 8px; opacity: 0; animation: fadeIn 2s ease forwards;
}
#menu-subtitle {
  font-size: 16px; color: #5D4037; margin-bottom: 60px;
  opacity: 0; animation: fadeIn 2s ease 0.5s forwards;
}
.menu-btn {
  font-family: 'Noto Serif SC', serif; font-size: 18px; color: #3E2723;
  background: none; border: none; cursor: pointer;
  padding: 12px 32px; margin: 6px; position: relative;
  opacity: 0; animation: fadeIn 1.5s ease 1s forwards;
  transition: color 0.3s;
}
.menu-btn::after {
  content: ''; position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
  width: 0; height: 1px; background: #3E2723; transition: width 0.3s;
}
.menu-btn:hover { color: #FF8F00; }
.menu-btn:hover::after { width: 60%; background: #FF8F00; }
@keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

/* Encounter Dialog */
#encounter-panel {
  display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.4); backdrop-filter: blur(2px);
  display: none; align-items: center; justify-content: center;
}
#encounter-box {
  background: #EFEBE9; max-width: 560px; width: 90%; padding: 32px;
  border-radius: 4px; box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  position: relative;
  background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence baseFrequency='0.8' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
}
#encounter-title {
  font-family: 'Ma Shan Zheng', cursive; font-size: 24px; margin-bottom: 12px;
  color: #3E2723;
}
#encounter-desc {
  font-size: 15px; line-height: 1.8; color: #4E342E; margin-bottom: 24px;
}
#encounter-options { display: flex; flex-direction: column; gap: 10px; }
.option-btn {
  font-family: 'Noto Serif SC', serif; font-size: 14px;
  text-align: left; padding: 12px 16px; background: #D7CCC8;
  border: 1px solid #BCAAA4; border-radius: 3px; cursor: pointer;
  color: #3E2723; transition: all 0.2s; line-height: 1.5;
}
.option-btn:hover { background: #FFE0B2; border-color: #FF8F00; }
.option-cost {
  font-size: 12px; color: #8D6E63; margin-top: 4px;
}

/* Outcome Panel */
#outcome-panel {
  display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.4); align-items: center; justify-content: center;
}
#outcome-box {
  background: #EFEBE9; max-width: 480px; width: 85%; padding: 28px;
  border-radius: 4px; text-align: center;
}
#outcome-text { font-size: 15px; line-height: 1.8; color: #4E342E; margin-bottom: 20px; }
#outcome-changes { font-size: 13px; color: #8D6E63; margin-bottom: 20px; }
#outcome-continue {
  font-family: 'Noto Serif SC', serif; font-size: 15px;
  background: none; border: 1px solid #8D6E63; color: #3E2723;
  padding: 8px 28px; cursor: pointer; border-radius: 3px;
  transition: all 0.2s;
}
#outcome-continue:hover { background: #D7CCC8; }

/* Camp Panel */
#camp-panel {
  display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.5); align-items: center; justify-content: center;
}
#camp-box {
  background: linear-gradient(180deg, #3E2723 0%, #4E342E 100%);
  max-width: 600px; width: 90%; padding: 28px; border-radius: 6px;
  color: #EFEBE9;
}
#camp-title {
  font-family: 'Ma Shan Zheng', cursive; font-size: 26px;
  text-align: center; margin-bottom: 16px; color: #FFB300;
}
#camp-summary { font-size: 14px; line-height: 1.7; margin-bottom: 16px; color: #D7CCC8; }
#camp-companions { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
.camp-companion-card {
  flex: 1; min-width: 120px; background: rgba(255,255,255,0.08);
  padding: 12px; border-radius: 4px; cursor: pointer; transition: all 0.2s;
  text-align: center;
}
.camp-companion-card:hover { background: rgba(255,143,0,0.15); }
.camp-companion-name { font-size: 15px; margin-bottom: 4px; }
.camp-companion-role { font-size: 12px; color: #BCAAA4; }
.camp-companion-trust { font-size: 11px; color: #FFB300; margin-top: 4px; }

#camp-dialogue {
  display: none; background: rgba(255,255,255,0.05);
  padding: 16px; border-radius: 4px; margin-bottom: 16px;
  font-size: 14px; line-height: 1.8; color: #EFEBE9;
  font-style: italic;
}
#camp-rest-btn {
  display: block; margin: 0 auto;
  font-family: 'Noto Serif SC', serif; font-size: 15px;
  background: none; border: 1px solid #8D6E63; color: #EFEBE9;
  padding: 8px 32px; cursor: pointer; border-radius: 3px;
  transition: all 0.2s;
}
#camp-rest-btn:hover { background: rgba(255,143,0,0.2); border-color: #FFB300; }

/* Night / Memory Panel */
#night-panel {
  display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.7); align-items: center; justify-content: center;
}
#night-box {
  max-width: 500px; width: 85%; text-align: center; color: #EFEBE9;
}
#night-text {
  font-size: 16px; line-height: 2; opacity: 0;
  animation: fadeIn 2s ease forwards;
}
#night-continue {
  margin-top: 30px; font-family: 'Noto Serif SC', serif; font-size: 14px;
  background: none; border: none; color: #8D6E63; cursor: pointer;
  opacity: 0; animation: fadeIn 1s ease 2s forwards;
}
#night-continue:hover { color: #FFB300; }

/* Ending */
#ending-panel {
  display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: #EFEBE9; overflow-y: auto;
}
#ending-content {
  max-width: 600px; margin: 0 auto; padding: 40px 20px;
}
#ending-title {
  font-family: 'Ma Shan Zheng', cursive; font-size: 48px; text-align: center;
  margin-bottom: 8px; opacity: 0; animation: fadeIn 2s ease forwards;
}
#ending-subtitle {
  text-align: center; font-size: 15px; color: #8D6E63; margin-bottom: 40px;
  opacity: 0; animation: fadeIn 2s ease 0.5s forwards;
}
#ending-narration {
  font-size: 16px; line-height: 2; color: #4E342E; margin-bottom: 40px;
  opacity: 0; animation: fadeIn 2s ease 1s forwards;
}
#ending-stats {
  display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 40px;
  opacity: 0; animation: fadeIn 1.5s ease 1.5s forwards;
}
.stat-card {
  background: #D7CCC8; padding: 16px; border-radius: 4px; text-align: center;
}
.stat-number { font-family: 'Ma Shan Zheng', cursive; font-size: 36px; color: #3E2723; }
.stat-label { font-size: 13px; color: #8D6E63; margin-top: 4px; }

#ending-timeline {
  margin-bottom: 40px; opacity: 0; animation: fadeIn 1.5s ease 2s forwards;
}
.timeline-day {
  display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px;
}
.timeline-dot {
  width: 12px; height: 12px; border-radius: 50%;
  background: #8D6E63; margin-top: 4px; flex-shrink: 0;
}
.timeline-dot.kind { background: #FF8F00; }
.timeline-text { font-size: 13px; line-height: 1.6; color: #5D4037; }

#ending-actions {
  text-align: center; opacity: 0; animation: fadeIn 1s ease 2.5s forwards;
}
#replay-btn {
  font-family: 'Noto Serif SC', serif; font-size: 16px;
  background: none; border: 1px solid #3E2723; color: #3E2723;
  padding: 10px 36px; cursor: pointer; border-radius: 3px;
  transition: all 0.2s;
}
#replay-btn:hover { background: #3E2723; color: #EFEBE9; }

/* Companion info popup */
#companion-info {
  display: none; position: absolute; right: 20px; bottom: 70px;
  background: rgba(62,39,35,0.9); color: #EFEBE9; padding: 12px 16px;
  border-radius: 4px; font-size: 13px; min-width: 160px;
  backdrop-filter: blur(6px);
}
.trust-bar { height: 3px; background: #5D4037; border-radius: 2px; margin-top: 6px; }
.trust-fill { height: 100%; background: #FFB300; border-radius: 2px; transition: width 0.4s; }

/* Dawn narration */
#dawn-panel {
  display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.5); align-items: center; justify-content: center;
}
#dawn-box {
  max-width: 500px; width: 85%; text-align: center; color: #EFEBE9;
}
#dawn-text {
  font-size: 17px; line-height: 2; opacity: 0;
  animation: fadeIn 2s ease forwards;
}
#dawn-continue {
  margin-top: 28px; font-family: 'Noto Serif SC', serif; font-size: 14px;
  background: none; border: none; color: #BCAAA4; cursor: pointer;
  opacity: 0; animation: fadeIn 1s ease 1.5s forwards;
}
#dawn-continue:hover { color: #FFB300; }

/* Transition overlay */
#transition {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: #2C2C2C; pointer-events: none; opacity: 0;
  transition: opacity 1s ease;
}
#transition.active { opacity: 1; }

/* Search prompt */
#search-prompt {
  display: none; position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(62,39,35,0.85); color: #EFEBE9;
  padding: 16px 24px; border-radius: 6px; text-align: center;
  font-size: 14px; backdrop-filter: blur(4px);
}
#search-prompt button {
  font-family: 'Noto Serif SC', serif; margin-top: 10px;
  background: none; border: 1px solid #EFEBE9; color: #EFEBE9;
  padding: 6px 20px; cursor: pointer; border-radius: 3px; font-size: 13px;
}
#search-prompt button:hover { background: rgba(255,255,255,0.1); }
</style>
</head>
<body>

<canvas id="game-canvas"></canvas>

<div id="ui-layer">
  <!-- HUD -->
  <div id="hud">
    <span id="hud-day">第一天</span>
    <span id="hud-weather"></span>
  </div>
  <div id="hud-stamina"><div id="stamina-fill" style="width:100%"></div></div>
  <div id="hud-supplies"></div>
  <div id="hud-companions"></div>

  <!-- Main Menu -->
  <div id="main-menu">
    <div id="menu-title">归途</div>
    <div id="menu-subtitle">The Way Home</div>
    <button class="menu-btn" id="btn-start">开始旅程</button>
    <button class="menu-btn" id="btn-continue" style="display:none">继续行走</button>
  </div>

  <!-- Encounter -->
  <div id="encounter-panel">
    <div id="encounter-box">
      <div id="encounter-title"></div>
      <div id="encounter-desc"></div>
      <div id="encounter-options"></div>
    </div>
  </div>

  <!-- Outcome -->
  <div id="outcome-panel">
    <div id="outcome-box">
      <div id="outcome-text"></div>
      <div id="outcome-changes"></div>
      <button id="outcome-continue">继续走</button>
    </div>
  </div>

  <!-- Dawn -->
  <div id="dawn-panel">
    <div id="dawn-box">
      <div id="dawn-text"></div>
      <button id="dawn-continue">出发</button>
    </div>
  </div>

  <!-- Camp -->
  <div id="camp-panel">
    <div id="camp-box">
      <div id="camp-title">营火</div>
      <div id="camp-summary"></div>
      <div id="camp-companions"></div>
      <div id="camp-dialogue"></div>
      <button id="camp-rest-btn">休息</button>
    </div>
  </div>

  <!-- Night -->
  <div id="night-panel">
    <div id="night-box">
      <div id="night-text"></div>
      <button id="night-continue">闭上眼睛</button>
    </div>
  </div>

  <!-- Ending -->
  <div id="ending-panel">
    <div id="ending-content">
      <div id="ending-title">归途</div>
      <div id="ending-subtitle"></div>
      <div id="ending-narration"></div>
      <div id="ending-stats"></div>
      <div id="ending-timeline"></div>
      <div id="ending-actions">
        <button id="replay-btn">再走一次</button>
      </div>
    </div>
  </div>

  <!-- Search -->
  <div id="search-prompt">
    <div>这里有一片废墟，要搜索一下吗？</div>
    <button id="search-yes">搜索</button>
    <button id="search-no">继续走</button>
  </div>

  <!-- Companion Info -->
  <div id="companion-info"></div>

  <!-- Transition -->
  <div id="transition"></div>
</div>

<script>
// ============================================================
// GAME DATA
// ============================================================

const PALETTE = {
  ruins: { gray: "#8D8D8D", rust: "#A0522D", char: "#2C2C2C", dust: "#BCAAA4" },
  nature: { green: "#7CB342", sky: "#64B5F6", flower: "#FFB74D", water: "#4FC3F7" },
  campfire: { amber: "#FF8F00", warm: "#FFB300", ember: "#E65100" },
  mood: { kind: "#FFF3E0", cold: "#ECEFF1", sad: "#CFD8DC" },
  ui: { paper: "#EFEBE9", ink: "#3E2723", highlight: "#FF8F00" }
};

const DAY_NAMES = ["第一天", "第二天", "第三天", "第四天", "第五天", "第六天", "第七天"];

const LANDSCAPES = [
  { id: "crater_field", name: "弹坑原野", ground: "#8B7D6B", sky1: "#B0BEC5", sky2: "#78909C",
    features: "craters", featureColor: "#6D6050", detailColor: "#7CB342", weather: "clear" },
  { id: "ruined_town", name: "废墟城镇", ground: "#9E9E9E", sky1: "#90A4AE", sky2: "#607D8B",
    features: "ruins", featureColor: "#757575", detailColor: "#A0522D", weather: "overcast" },
  { id: "forest_path", name: "森林小径", ground: "#5D4037", sky1: "#81C784", sky2: "#388E3C",
    features: "trees", featureColor: "#2E7D32", detailColor: "#8BC34A", weather: "rain" },
  { id: "river_valley", name: "河谷", ground: "#8D6E63", sky1: "#64B5F6", sky2: "#1976D2",
    features: "river", featureColor: "#42A5F5", detailColor: "#7CB342", weather: "clear" },
  { id: "mountain", name: "山岭", ground: "#78909C", sky1: "#CFD8DC", sky2: "#90A4AE",
    features: "mountains", featureColor: "#546E7A", detailColor: "#FAFAFA", weather: "snow" },
  { id: "plains", name: "平原", ground: "#A1887F", sky1: "#FFE0B2", sky2: "#FF8F00",
    features: "grass", featureColor: "#8BC34A", detailColor: "#FFB74D", weather: "clear" },
  { id: "hometown", name: "家", ground: "#8D6E63", sky1: "#FFF3E0", sky2: "#FFB74D",
    features: "home", featureColor: "#5D4037", detailColor: "#7CB342", weather: "clear" }
];

const TIME_OF_DAY = {
  dawn:  { skyMul: [1.1, 1.0, 0.9], overlay: "rgba(255,183,77,0.12)", name: "黎明" },
  noon:  { skyMul: [1.0, 1.0, 1.0], overlay: "rgba(255,255,255,0.05)", name: "正午" },
  dusk:  { skyMul: [1.0, 0.8, 0.7], overlay: "rgba(255,111,0,0.15)", name: "黄昏" },
  night: { skyMul: [0.4, 0.4, 0.6], overlay: "rgba(0,0,40,0.35)", name: "夜晚" }
};

const LORE = {
  backstory: "战争持续了四年。你记不清开始的原因了。你只记得最后一声枪响后的寂静——那种寂静比任何炮声都要响。\n\n现在，你要回家。三百公里。七天。",
  day_dawn: [
    "东方有光。你背起行囊，踩过弹坑，开始走。空气里还有硝烟的味道，但远处有鸟在叫。",
    "废墟。曾经是一个镇子。邮局的招牌还挂着，歪歪斜斜。你从瓦砾间穿过。",
    "树林的边缘。被烧过的树干旁，居然长出了新叶。你停下来看了很久。",
    "河谷。水声代替了炮声。你站在断桥边，需要找到过河的路。",
    "山路。风变冷了。脚下是碎石，头上是灰色的天。最艰难的一天。",
    "平原。天终于晴了。远处是无尽的地平线，草地开始出现。你走得快了一些。",
    "你看到了。远处的轮廓——那棵老树，那个烟囱。你的脚步停了一秒，然后，你开始跑。"
  ],
  day_dusk: [
    "第一天结束了。你找到一小块平地，点起火。火光映着弹坑里积水的倒影。你四年来第一次不用警戒。",
    "你在一堵还立着的墙边扎营。墙上有人用粉笔写着一个名字和一个日期。",
    "林间空地，落叶铺成毯子。虫鸣声让你想起小时候的夏天。",
    "河边扎营。水声很好听。对岸有什么在闪光——是月光照在铁轨上。",
    "山洞里避风。大家挤在一起。有人开始轻声唱歌。",
    "最后一个营地。草地上，星星很亮。明天就到了。没有人说话，但每个人都醒着。",
    ""
  ],
  day_night: [
    "你闭上眼。但你没有做梦。你只是听着风声，想着家里的门是什么颜色。",
    "你梦到了战前。你在厨房里，闻到了妈妈做的汤。你醒来时发现自己在笑。",
    "你开始想，路上遇到的那些人，他们也在找回家的路吗？",
    "你梦到了河。河水很清。你看到了自己的倒影——比你记忆中老了很多。",
    "风在山洞外呼啸。你想起了战场上那些再也回不了家的人。你替他们看了今晚的星星。",
    "你没有睡。你坐在草地上，看着东方，等待日出。最后一次等待。",
    ""
  ],
  endings: {

// ============================================================
// GAME ENGINE
// ============================================================

const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ============================================================
// PARTICLE SYSTEM
// ============================================================

class Particle {
  constructor(config) {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.size = config.size + Math.random() * 2;
    this.speed = config.speed * (0.5 + Math.random());
    this.color = config.color;
    this.type = config.type;
    this.life = 1;
    this.drift = (Math.random() - 0.5) * 0.5;
    this.opacity = 0.3 + Math.random() * 0.5;
  }

  update(dt) {
    if (this.type === 'fall') {
      this.y += this.speed * dt * 60;
      this.x += this.drift * dt * 60;
    } else if (this.type === 'drift') {
      this.y += this.speed * dt * 60;
      this.x += Math.sin(Date.now() * 0.001 + this.drift * 10) * 0.5;
    } else if (this.type === 'rise') {
      this.y += this.speed * dt * 60;
      this.x += Math.sin(Date.now() * 0.002 + this.x) * 0.3;
    }
    if (this.y > H + 10) { this.y = -10; this.x = Math.random() * W; }
    if (this.y < -10) { this.y = H + 10; this.x = Math.random() * W; }
    if (this.x > W + 10) this.x = -10;
    if (this.x < -10) this.x = W + 10;
  }

  draw(ctx) {
    ctx.fillStyle = this.color;
    ctx.globalAlpha = this.opacity;
    ctx.fillRect(this.x, this.y, this.size, this.type === 'fall' ? this.size * 3 : this.size);
    ctx.globalAlpha = 1;
  }
}

class ParticleSystem {
  constructor() { this.particles = []; }

  setWeather(weather) {
    this.particles = [];
    const cfg = weather === 'rain' ? VFX_CONFIG.rain :
                weather === 'snow' ? VFX_CONFIG.snow :
                weather === 'overcast' ? VFX_CONFIG.ash : null;
    if (cfg) {
      for (let i = 0; i < cfg.count; i++) {
        this.particles.push(new Particle(cfg));
      }
    }
  }

  addEmbers() {
    const cfg = VFX_CONFIG.ember;
    for (let i = 0; i < cfg.count; i++) {
      const p = new Particle(cfg);
      p.x = W * 0.3 + Math.random() * W * 0.4;
      p.y = H * 0.7 + Math.random() * H * 0.2;
      this.particles.push(p);
    }
  }

  update(dt) { this.particles.forEach(p => p.update(dt)); }
  draw(ctx) { this.particles.forEach(p => p.draw(ctx)); }
}

// ============================================================
// BACKGROUND RENDERER
// ============================================================

function drawLandscape(landscape, timeOfDay, scrollX) {
  const ls = landscape;
  const tod = TIME_OF_DAY[timeOfDay];

  // Sky gradient
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.65);
  skyGrad.addColorStop(0, ls.sky1);
  skyGrad.addColorStop(1, ls.sky2);
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H * 0.65);

  // Sun/Moon
  if (timeOfDay === 'dawn' || timeOfDay === 'noon') {
    const sunX = timeOfDay === 'dawn' ? W * 0.15 : W * 0.5;
    const sunY = timeOfDay === 'dawn' ? H * 0.35 : H * 0.15;
    const sunGrad = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 60);
    sunGrad.addColorStop(0, 'rgba(255,224,130,0.8)');
    sunGrad.addColorStop(1, 'rgba(255,224,130,0)');
    ctx.fillStyle = sunGrad;
    ctx.fillRect(sunX - 80, sunY - 80, 160, 160);
  } else if (timeOfDay === 'dusk') {
    const sunGrad = ctx.createRadialGradient(W * 0.8, H * 0.3, 0, W * 0.8, H * 0.3, 80);
    sunGrad.addColorStop(0, 'rgba(255,111,0,0.6)');
    sunGrad.addColorStop(1, 'rgba(255,111,0,0)');
    ctx.fillStyle = sunGrad;
    ctx.fillRect(W * 0.65, H * 0.1, W * 0.35, H * 0.5);
  } else if (timeOfDay === 'night') {
    // Stars
    ctx.fillStyle = '#FAFAFA';
    for (let i = 0; i < 30; i++) {
      const sx = (i * 137.5 + scrollX * 0.01) % W;
      const sy = (i * 97.3) % (H * 0.4);
      ctx.globalAlpha = 0.3 + Math.sin(Date.now() * 0.001 + i) * 0.3;
      ctx.fillRect(sx, sy, 2, 2);
    }
    ctx.globalAlpha = 1;
  }

  // Far mountains/hills (parallax layer 1)
  ctx.fillStyle = ls.featureColor + '40';
  ctx.beginPath();
  ctx.moveTo(0, H * 0.5);
  for (let x = 0; x <= W; x += 40) {
    const noise = Math.sin((x + scrollX * 0.1) * 0.005) * 40 +
                  Math.sin((x + scrollX * 0.1) * 0.013) * 20;
    ctx.lineTo(x, H * 0.45 + noise);
  }
  ctx.lineTo(W, H * 0.65);
  ctx.lineTo(0, H * 0.65);
  ctx.fill();

  // Mid features (parallax layer 2)
  drawFeatures(ls, scrollX);

  // Ground
  const groundGrad = ctx.createLinearGradient(0, H * 0.65, 0, H);
  groundGrad.addColorStop(0, ls.ground);
  groundGrad.addColorStop(1, adjustColor(ls.ground, -30));
  ctx.fillStyle = groundGrad;
  ctx.fillRect(0, H * 0.65, W, H * 0.35);

  // Ground texture
  ctx.fillStyle = adjustColor(ls.ground, -15) + '60';
  for (let x = 0; x < W; x += 20) {
    const gx = (x + scrollX * 0.8) % (W + 100) - 50;
    const gy = H * 0.7 + Math.sin(gx * 0.1) * 5;
    ctx.fillRect(gx, gy, 8, 2);
  }

  // Time of day overlay
  ctx.fillStyle = tod.overlay;
  ctx.fillRect(0, 0, W, H);
}

function drawFeatures(ls, scrollX) {
  const feat = ls.features;

  if (feat === 'craters') {
    // Craters
    ctx.fillStyle = adjustColor(ls.ground, -20) + '80';
    for (let i = 0; i < 8; i++) {
      const cx = ((i * 237 + scrollX * 0.4) % (W + 200)) - 100;
      const cy = H * 0.6 + (i % 3) * 20;
      ctx.beginPath();
      ctx.ellipse(cx, cy, 30 + i * 5, 10, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    // Small flower
    ctx.fillStyle = ls.detailColor;
    const flowerX = ((500 + scrollX * 0.4) % (W + 200)) - 100;
    ctx.fillRect(flowerX, H * 0.62, 2, 8);
    ctx.beginPath();
    ctx.arc(flowerX + 1, H * 0.61, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#FFB74D';
    ctx.fill();
  }
  else if (feat === 'ruins') {
    // Broken buildings
    ctx.fillStyle = '#757575';
    for (let i = 0; i < 6; i++) {
      const bx = ((i * 320 + scrollX * 0.3) % (W + 400)) - 200;
      const bh = 40 + (i * 17) % 60;
      ctx.fillRect(bx, H * 0.65 - bh, 35 + (i * 7) % 25, bh);
      // Broken top
      ctx.fillStyle = '#616161';
      ctx.beginPath();
      ctx.moveTo(bx, H * 0.65 - bh);
      ctx.lineTo(bx + 15, H * 0.65 - bh - 10 - (i % 3) * 8);
      ctx.lineTo(bx + 30, H * 0.65 - bh + 5);
      ctx.fill();
      ctx.fillStyle = '#757575';
    }
    // Graffiti on wall
    ctx.fillStyle = ls.detailColor;
    const gx = ((800 + scrollX * 0.3) % (W + 400)) - 200;
    ctx.fillRect(gx + 5, H * 0.58, 2, 2);
    ctx.fillRect(gx + 9, H * 0.57, 2, 3);
    ctx.fillRect(gx + 13, H * 0.58, 2, 2);
  }
  else if (feat === 'trees') {
    for (let i = 0; i < 10; i++) {
      const tx = ((i * 200 + scrollX * 0.35) % (W + 300)) - 150;
      const th = 60 + (i * 23) % 40;
      // Burnt trunk
      ctx.fillStyle = '#4E342E';
      ctx.fillRect(tx, H * 0.65 - th, 6, th);
      // New leaves
      if (i % 2 === 0) {
        ctx.fillStyle = ls.detailColor + 'A0';
        ctx.beginPath();
        ctx.arc(tx + 3, H * 0.65 - th - 10, 15, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    // Sunbeams
    ctx.fillStyle = 'rgba(255,224,130,0.06)';
    for (let i = 0; i < 5; i++) {
      const bx = ((i * 350 + scrollX * 0.2) % (W + 200)) - 100;
      ctx.beginPath();
      ctx.moveTo(bx, 0);
      ctx.lineTo(bx - 20, H * 0.65);
      ctx.lineTo(bx + 20, H * 0.65);
      ctx.fill();
    }
  }
  else if (feat === 'river') {
    // River
    ctx.fillStyle = ls.featureColor + '80';
    ctx.beginPath();
    ctx.moveTo(0, H * 0.6);
    for (let x = 0; x <= W; x += 10) {
      ctx.lineTo(x, H * 0.58 + Math.sin((x + scrollX * 0.3 + Date.now() * 0.001) * 0.03) * 8);
    }
    ctx.lineTo(W, H * 0.65);
    ctx.lineTo(0, H * 0.65);
    ctx.fill();
    // River sparkle
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    for (let i = 0; i < 10; i++) {
      const rx = ((i * 190 + scrollX * 0.3 + Date.now() * 0.02) % W);
      ctx.fillRect(rx, H * 0.59 + Math.sin(rx * 0.05) * 3, 3, 1);
    }
  }
  else if (feat === 'mountains') {
    // Mountain peaks
    ctx.fillStyle = ls.featureColor;
    for (let i = 0; i < 5; i++) {
      const mx = ((i * 400 + scrollX * 0.15) % (W + 500)) - 250;
      const mh = 80 + (i * 37) % 60;
      ctx.beginPath();
      ctx.moveTo(mx - 80, H * 0.65);
      ctx.lineTo(mx, H * 0.65 - mh);
      ctx.lineTo(mx + 80, H * 0.65);
      ctx.fill();
      // Snow cap
      ctx.fillStyle = '#FAFAFA';
      ctx.beginPath();
      ctx.moveTo(mx - 15, H * 0.65 - mh + 20);
      ctx.lineTo(mx, H * 0.65 - mh);
      ctx.lineTo(mx + 15, H * 0.65 - mh + 20);
      ctx.fill();
      ctx.fillStyle = ls.featureColor;
    }
  }
  else if (feat === 'grass') {
    // Grass tufts
    ctx.fillStyle = ls.featureColor;
    for (let i = 0; i < 30; i++) {
      const gx = ((i * 67 + scrollX * 0.5) % (W + 100)) - 50;
      const gy = H * 0.63 + (i % 4) * 5;
      ctx.beginPath();
      ctx.moveTo(gx, gy);
      ctx.lineTo(gx + 3, gy - 8 - (i % 3) * 3);
      ctx.lineTo(gx + 6, gy);
      ctx.fill();
    }
    // Sunset glow
    const sgGrad = ctx.createRadialGradient(W * 0.7, H * 0.4, 0, W * 0.7, H * 0.4, W * 0.4);
    sgGrad.addColorStop(0, 'rgba(255,183,77,0.15)');
    sgGrad.addColorStop(1, 'rgba(255,183,77,0)');
    ctx.fillStyle = sgGrad;
    ctx.fillRect(0, 0, W, H * 0.65);
  }
  else if (feat === 'home') {
    // House silhouette
    const hx = ((W * 0.7 + scrollX * 0.1) % (W + 300));
    ctx.fillStyle = ls.featureColor;
    ctx.fillRect(hx, H * 0.55, 40, 30);
    // Roof
    ctx.beginPath();
    ctx.moveTo(hx - 5, H * 0.55);
    ctx.lineTo(hx + 20, H * 0.45);
    ctx.lineTo(hx + 45, H * 0.55);
    ctx.fill();
    // Chimney
    ctx.fillRect(hx + 30, H * 0.45, 8, 15);
    // Smoke
    ctx.fillStyle = 'rgba(200,200,200,0.3)';
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.arc(hx + 34 + Math.sin(Date.now() * 0.001 + i) * 5, H * 0.42 - i * 12, 5 + i * 2, 0, Math.PI * 2);
      ctx.fill();
    }
    // Tree
    ctx.fillStyle = '#5D4037';
    ctx.fillRect(hx - 40, H * 0.52, 6, 28);
    ctx.fillStyle = '#7CB342';
    ctx.beginPath();
    ctx.arc(hx - 37, H * 0.48, 18, 0, Math.PI * 2);
    ctx.fill();
    // Fence
    ctx.fillStyle = '#8D6E63';
    for (let i = 0; i < 6; i++) {
      ctx.fillRect(hx + 55 + i * 15, H * 0.6, 3, 18);
    }
    ctx.fillRect(hx + 55, H * 0.63, 80, 2);
    ctx.fillRect(hx + 55, H * 0.69, 80, 2);
  }
}

function adjustColor(hex, amount) {
  const num = parseInt(hex.slice(1), 16);
  const r = Math.min(255, Math.max(0, (num >> 16) + amount));
  const g = Math.min(255, Math.max(0, ((num >> 8) & 0xFF) + amount));
  const b = Math.min(255, Math.max(0, (num & 0xFF) + amount));
  return `#${(r << 16 | g << 8 | b).toString(16).padStart(6, '0')}`;
}

// CHARACTER RENDERER
// ============================================================

function drawCharacter(x, y, walking, icon, scale = 1) {
  const bobY = walking ? Math.sin(Date.now() * 0.005) * 3 : 0;
  const legPhase = walking ? Math.sin(Date.now() * 0.008) * 0.3 : 0;
  const s = scale;

  ctx.save();
  ctx.translate(x, y + bobY);

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath();
  ctx.ellipse(0, 12 * s, 10 * s, 3 * s, 0, 0, Math.PI * 2);
  ctx.fill();

  if (icon) {
    // Companion: just draw emoji
    ctx.font = `${28 * s}px serif`;
    ctx.textAlign = 'center';
    ctx.fillText(icon, 0, 0);
  } else {
    // Main character - simple figure
    // Legs
    ctx.strokeStyle = '#5D4037';
    ctx.lineWidth = 2.5 * s;
    ctx.beginPath();
    ctx.moveTo(-3 * s, 2 * s);
    ctx.lineTo(-3 * s + Math.sin(legPhase) * 4 * s, 12 * s);
    ctx.moveTo(3 * s, 2 * s);
    ctx.lineTo(3 * s - Math.sin(legPhase) * 4 * s, 12 * s);
    ctx.stroke();

    // Body
    ctx.fillStyle = '#5D6037';
    ctx.fillRect(-5 * s, -10 * s, 10 * s, 14 * s);

    // Backpack
    ctx.fillStyle = '#8D6E63';
    ctx.fillRect(-8 * s, -8 * s, 4 * s, 10 * s);

    // Head
    ctx.fillStyle = '#D7CCC8';
    ctx.beginPath();
    ctx.arc(0, -14 * s, 6 * s, 0, Math.PI * 2);
    ctx.fill();

    // Hair
    ctx.fillStyle = '#4E342E';
    ctx.beginPath();
    ctx.arc(0, -16 * s, 6 * s, Math.PI, Math.PI * 2);
    ctx.fill();

    // Arms
    ctx.strokeStyle = '#D7CCC8';
    ctx.lineWidth = 2 * s;
    const armSwing = walking ? Math.sin(Date.now() * 0.008) * 0.2 : 0;
    ctx.beginPath();
    ctx.moveTo(-5 * s, -6 * s);
    ctx.lineTo(-9 * s + Math.sin(armSwing) * 3 * s, 2 * s);
    ctx.moveTo(5 * s, -6 * s);
    ctx.lineTo(9 * s - Math.sin(armSwing) * 3 * s, 2 * s);
    ctx.stroke();
  }

  ctx.restore();
}

// ============================================================
// GAME STATE
// ============================================================

const gameState = {
  scene: 'menu', // menu, walking, encounter, outcome, camp, night, dawn, ending
  day: 0,
  timeOfDay: 'dawn', // dawn, noon, dusk, night
  scrollX: 0,
  walkSpeed: 1.5,
  walking: false,

  // Resources
  food: SUPPLIES_CONFIG.initialLoadout.food,
  water: SUPPLIES_CONFIG.initialLoadout.water,
  medicine: SUPPLIES_CONFIG.initialLoadout.medicine,
  backpackCapacity: SUPPLIES_CONFIG.backpackCapacity,
  stamina: 100,

  // Companions
  companions: [], // array of companion objects
  maxCompanions: 4,

  // Encounters
  encountersDone: 0,
  encountersPerDay: 0,
  encounterTimer: 0,
  nextEncounterDistance: 0,
  currentEncounter: null,
  usedEncounterIds: new Set(),

  // Journey stats
  totalHelped: 0,
  totalKindChoices: 0,
  totalColdChoices: 0,
  distanceWalked: 0,
  choiceLog: [], // { day, title, choiceText }

  // Mood: -1 (cold) to 1 (kind)
  moodShift: 0,

  // Character position
  charX: 0,
  charBaseY: 0,

  // Walking distance for current day
  dayDistance: 0,
  dayDistanceTarget: 0,

  // Search opportunity
  searchAvailable: false,

  // Companion who left
  companionLeft: null
};

// ============================================================
// GAME LOGIC
// ============================================================

function startGame() {
  gameState.scene = 'dawn';
  gameState.day = 0;
  gameState.food = SUPPLIES_CONFIG.initialLoadout.food;
  gameState.water = SUPPLIES_CONFIG.initialLoadout.water;
  gameState.medicine = SUPPLIES_CONFIG.initialLoadout.medicine;
  gameState.stamina = 100;
  gameState.companions = [];
  gameState.encountersDone = 0;
  gameState.usedEncounterIds = new Set();
  gameState.totalHelped = 0;
  gameState.totalKindChoices = 0;
  gameState.totalColdChoices = 0;
  gameState.distanceWalked = 0;
  gameState.choiceLog = [];
  gameState.moodShift = 0;
  gameState.scrollX = 0;
  gameState.companionLeft = null;

  hideAllPanels();
  document.getElementById('main-menu').style.display = 'none';
  document.getElementById('hud').style.display = 'block';

  startNewDay();
}

function startNewDay() {
  gameState.day++;
  if (gameState.day > 7) {
    showEnding();
    return;
  }

  gameState.timeOfDay = 'dawn';
  gameState.encountersDone = 0;
  gameState.encountersPerDay = 3 + Math.floor(Math.random() * 2); // 3-4
  gameState.dayDistance = 0;
  gameState.dayDistanceTarget = 800 + Math.random() * 400;
  gameState.nextEncounterDistance = gameState.dayDistanceTarget / (gameState.encountersPerDay + 1);
  gameState.encounterTimer = gameState.nextEncounterDistance;
  gameState.walking = false;
  gameState.searchAvailable = false;

  // Consume daily resources
  if (gameState.day > 1) {
    consumeDailyResources();
  }

  // Set up particles for weather
  const landscape = LANDSCAPES[gameState.day - 1];
  particles.setWeather(landscape.weather);

  // Show dawn narration
  showDawn();
}

function consumeDailyResources() {
  let foodNeeded = SUPPLIES_CONFIG.dailyCostBase.food;
  let waterNeeded = SUPPLIES_CONFIG.dailyCostBase.water;
  let medNeeded = 0;

  gameState.companions.forEach(c => {
    const data = COMPANIONS_DATA.find(cd => cd.id === c.id);
    if (data) {
      foodNeeded += data.dailyCost.food || 0;
      waterNeeded += data.dailyCost.water || 0;
      medNeeded += data.dailyCost.medicine || 0;
    }
  });

  gameState.food = Math.max(0, gameState.food - foodNeeded);
  gameState.water = Math.max(0, gameState.water - waterNeeded);
  gameState.medicine = Math.max(0, gameState.medicine - medNeeded);

  // Stamina recovery from camping
  gameState.stamina = Math.min(100, gameState.stamina + 40);

  // Check if companions leave due to lack of food
  if (gameState.food <= 0 && gameState.companions.length > 0) {
    // Chance of losing a companion
    if (Math.random() < 0.4) {
      const hasGrandma = gameState.companions.find(c => c.id === 'grandma_sun');
      if (!hasGrandma) {
        const leaveIdx = Math.floor(Math.random() * gameState.companions.length);
        const leaving = gameState.companions.splice(leaveIdx, 1)[0];
        const data = COMPANIONS_DATA.find(cd => cd.id === leaving.id);
        gameState.companionLeft = data;
      }
    }
  }

  // Mood affects stamina
  if (gameState.moodShift < -0.3) {
    gameState.stamina = Math.max(10, gameState.stamina - 10);
  }
}

function showDawn() {
  gameState.scene = 'dawn';
  const panel = document.getElementById('dawn-panel');
  const textEl = document.getElementById('dawn-text');

  let text = LORE.day_dawn[gameState.day - 1];

  // Show companion left info
  if (gameState.companionLeft) {
    text = gameState.companionLeft.leave_dialogue + '\n\n' + text;
    gameState.companionLeft = null;
  }

  textEl.innerHTML = '';
  textEl.style.animation = 'none';
  void textEl.offsetHeight;
  textEl.style.animation = 'fadeIn 2s ease forwards';
  textEl.textContent = text;

  const btn = document.getElementById('dawn-continue');
  btn.style.animation = 'none';
  void btn.offsetHeight;
  btn.style.animation = 'fadeIn 1s ease 1.5s forwards';
  btn.style.opacity = '0';

  panel.style.display = 'flex';
  updateHUD();
}

function startWalking() {
  gameState.scene = 'walking';
  gameState.walking = true;
  gameState.charX = W * 0.3;
  gameState.charBaseY = H * 0.62;
  hideAllPanels();
  updateHUD();
}

function updateWalking(dt) {
  if (gameState.scene !== 'walking' || !gameState.walking) return;

  // Speed based on stamina
  let speed = gameState.walkSpeed;
  if (gameState.stamina < 30) speed *= 0.5;
  else if (gameState.stamina < 50) speed *= 0.75;

  gameState.scrollX += speed * dt * 60;
  gameState.dayDistance += speed * dt * 60;
  gameState.distanceWalked += speed * dt * 2; // rough km calculation

  // Stamina drain
  gameState.stamina = Math.max(0, gameState.stamina - 0.01 * dt * 60);

  // Time of day progression
  const progress = gameState.dayDistance / gameState.dayDistanceTarget;
  if (progress < 0.15) gameState.timeOfDay = 'dawn';
  else if (progress < 0.6) gameState.timeOfDay = 'noon';
  else if (progress < 0.85) gameState.timeOfDay = 'dusk';
  else gameState.timeOfDay = 'dusk';

  // Search opportunity (random)
  if (!gameState.searchAvailable && Math.random() < 0.001 * dt * 60) {
    gameState.searchAvailable = true;
    showSearchPrompt();
  }

  // Encounter trigger
  if (gameState.encountersDone < gameState.encountersPerDay) {
    gameState.encounterTimer -= speed * dt * 60;
    if (gameState.encounterTimer <= 0) {
      triggerEncounter();
    }
  } else if (gameState.dayDistance >= gameState.dayDistanceTarget) {
    // Day complete, go to camp
    gameState.walking = false;
    showCamp();
  }

  updateHUD();
}

function triggerEncounter() {
  gameState.walking = false;

  // Find valid encounters for current day
  const validEncounters = ENCOUNTERS.filter(e => {
    if (gameState.usedEncounterIds.has(e.id)) return false;
    if (gameState.day < e.dayRange[0] || gameState.day > e.dayRange[1]) return false;
    // Don't show companion encounters if already have that companion
    const hasCompOption = e.options.some(o => o.gain && o.gain.companion);
    if (hasCompOption && gameState.companions.length >= gameState.maxCompanions) {
      // Still show but companion won't join
    }
    return true;
  });

  if (validEncounters.length === 0) {
    // No valid encounters, continue walking
    gameState.encountersDone++;
    gameState.encounterTimer = gameState.nextEncounterDistance;
    gameState.walking = true;
    return;
  }

  const encounter = validEncounters[Math.floor(Math.random() * validEncounters.length)];
  gameState.currentEncounter = encounter;
  gameState.usedEncounterIds.add(encounter.id);
  showEncounter(encounter);
}

function showEncounter(encounter) {
  gameState.scene = 'encounter';
  const panel = document.getElementById('encounter-panel');
  document.getElementById('encounter-title').textContent = encounter.title;
  document.getElementById('encounter-desc').textContent = encounter.desc;

  const optionsDiv = document.getElementById('encounter-options');
  optionsDiv.innerHTML = '';

  encounter.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';

    let costText = [];
    if (opt.cost.food) costText.push(`食物 -${opt.cost.food}`);
    if (opt.cost.water) costText.push(`水 -${opt.cost.water}`);
    if (opt.cost.medicine) costText.push(`药品 -${opt.cost.medicine}`);
    if (opt.cost.stamina) costText.push(`体力 -${opt.cost.stamina}`);

    btn.innerHTML = opt.text + (costText.length ? `<div class="option-cost">${costText.join(' · ')}</div>` : '');

    // Check if player can afford
    let canAfford = true;
    if (opt.cost.food && gameState.food < opt.cost.food) canAfford = false;
    if (opt.cost.water && gameState.water < opt.cost.water) canAfford = false;
    if (opt.cost.medicine && gameState.medicine < opt.cost.medicine) canAfford = false;
    if (opt.cost.stamina && gameState.stamina < opt.cost.stamina) canAfford = false;

    if (!canAfford) {
      btn.style.opacity = '0.4';
      btn.style.cursor = 'default';
      btn.innerHTML += '<div class="option-cost" style="color:#c62828">补给不足</div>';
    } else {
      btn.onclick = () => makeChoice(i);
    }

    optionsDiv.appendChild(btn);
  });

  panel.style.display = 'flex';
}

function makeChoice(optionIdx) {
  const encounter = gameState.currentEncounter;
  const option = encounter.options[optionIdx];

  // Apply costs
  const actualCost = option.costActual || option.cost;
  if (actualCost.food) gameState.food = Math.max(0, gameState.food - actualCost.food);
  if (actualCost.water) gameState.water = Math.max(0, gameState.water - actualCost.water);
  if (actualCost.medicine) gameState.medicine = Math.max(0, gameState.medicine - actualCost.medicine);
  if (actualCost.stamina) gameState.stamina = Math.max(0, gameState.stamina - actualCost.stamina);

  // Apply gains
  if (option.gain) {
    if (option.gain.food) gameState.food = Math.min(gameState.backpackCapacity, gameState.food + option.gain.food);
    if (option.gain.water) gameState.water = Math.min(gameState.backpackCapacity, gameState.water + option.gain.water);
    if (option.gain.medicine) gameState.medicine = Math.min(gameState.backpackCapacity, gameState.medicine + option.gain.medicine);
    if (option.gain.stamina) gameState.stamina = Math.min(100, gameState.stamina + option.gain.stamina);
    if (option.gain.backpack) gameState.backpackCapacity += option.gain.backpack;

    // Add companion
    if (option.gain.companion && gameState.companions.length < gameState.maxCompanions) {
      const compId = option.gain.companion;
      if (!gameState.companions.find(c => c.id === compId)) {
        gameState.companions.push({ id: compId, trust: 20 });
      }
    }
  }

  // Apply trust changes
  if (option.trustAll) {
    gameState.companions.forEach(c => {
      c.trust = Math.min(100, Math.max(0, c.trust + option.trustAll));
    });
  }

  // Track stats
  if (option.trustAll > 0) {
    gameState.totalKindChoices++;
    gameState.moodShift = Math.min(1, gameState.moodShift + 0.1);
    if (Object.keys(actualCost).length > 0) gameState.totalHelped++;
  } else if (option.trustAll < 0) {
    gameState.totalColdChoices++;
    gameState.moodShift = Math.max(-1, gameState.moodShift - 0.1);
  }

  // Log choice
  gameState.choiceLog.push({
    day: gameState.day,
    title: encounter.title,
    choiceText: option.text,
    kind: (option.trustAll || 0) > 0
  });

  // Show outcome
  showOutcome(option);
}

function showOutcome(option) {
  gameState.scene = 'outcome';
  document.getElementById('encounter-panel').style.display = 'none';

  const panel = document.getElementById('outcome-panel');
  document.getElementById('outcome-text').textContent = option.outcome;

  let changes = [];
  const cost = option.costActual || option.cost;
  if (cost.food) changes.push(`食物 -${cost.food}`);
  if (cost.water) changes.push(`水 -${cost.water}`);
  if (cost.medicine) changes.push(`药品 -${cost.medicine}`);
  if (cost.stamina) changes.push(`体力 -${cost.stamina}`);
  if (option.gain) {
    if (option.gain.food) changes.push(`食物 +${option.gain.food}`);
    if (option.gain.water) changes.push(`水 +${option.gain.water}`);
    if (option.gain.medicine) changes.push(`药品 +${option.gain.medicine}`);
    if (option.gain.stamina) changes.push(`体力 +${option.gain.stamina}`);
    if (option.gain.companion) {
      const comp = COMPANIONS_DATA.find(c => c.id === option.gain.companion);
      if (comp && gameState.companions.find(c => c.id === option.gain.companion)) {
        changes.push(`${comp.name}加入了队伍`);
      }
    }
  }
  document.getElementById('outcome-changes').textContent = changes.join(' · ');

  panel.style.display = 'flex';
  updateHUD();
}

function continueAfterOutcome() {
  document.getElementById('outcome-panel').style.display = 'none';
  gameState.encountersDone++;
  gameState.encounterTimer = gameState.nextEncounterDistance;

  // Check if day should end
  if (gameState.encountersDone >= gameState.encountersPerDay) {
    showCamp();
  } else {
    gameState.scene = 'walking';
    gameState.walking = true;
  }
}

function showSearchPrompt() {
  gameState.walking = false;
  document.getElementById('search-prompt').style.display = 'block';
}

function doSearch() {
  gameState.searchAvailable = false;

  // Search results
  const hasVeteran = gameState.companions.find(c => c.id === 'old_chen');
  const hasFarmer = gameState.companions.find(c => c.id === 'farmer_wang');
  let findChance = 0.5;
  if (hasVeteran) findChance = 0.8;
  if (hasFarmer) findChance = 0.7;

  let msg;
  if (Math.random() < findChance) {
    const items = ['food', 'water', 'medicine'];
    const found = items[Math.floor(Math.random() * (Math.random() < 0.8 ? 2 : 3))];
    const amount = found === 'medicine' ? 1 : 1 + Math.floor(Math.random() * 2);

    if (found === 'food') gameState.food = Math.min(gameState.backpackCapacity, gameState.food + amount);
    if (found === 'water') gameState.water = Math.min(gameState.backpackCapacity, gameState.water + amount);
    if (found === 'medicine') gameState.medicine = Math.min(gameState.backpackCapacity, gameState.medicine + amount);

    const names = { food: '食物', water: '水', medicine: '药品' };
    msg = `你在废墟中找到了 ${amount} 份${names[found]}。`;
  } else {
    msg = '你搜索了一会儿，但什么都没找到。';
  }

  gameState.stamina = Math.max(0, gameState.stamina - 5);

  // Show result in search prompt, then auto-dismiss
  const sp = document.getElementById('search-prompt');
  sp.innerHTML = `<div>${msg}</div>`;
  setTimeout(() => {
    sp.style.display = 'none';
    gameState.walking = true;
    updateHUD();
  }, 1500);
}

function skipSearch() {
  document.getElementById('search-prompt').style.display = 'none';
  gameState.searchAvailable = false;
  gameState.walking = true;
}

function showCamp() {
  gameState.scene = 'camp';
  gameState.timeOfDay = 'night';
  particles.setWeather('');
  particles.addEmbers();

  const panel = document.getElementById('camp-panel');
  document.getElementById('camp-title').textContent = '营火 · ' + DAY_NAMES[gameState.day - 1];

  // Summary
  let summary = LORE.day_dusk[gameState.day - 1];
  document.getElementById('camp-summary').textContent = summary;

  // Companion cards
  const compDiv = document.getElementById('camp-companions');
  compDiv.innerHTML = '';
  document.getElementById('camp-dialogue').style.display = 'none';

  if (gameState.companions.length === 0) {
    compDiv.innerHTML = '<div style="color:#8D6E63;font-size:14px;text-align:center;width:100%">今晚只有你自己。火光在脸上跳动。</div>';
  } else {
    gameState.companions.forEach(comp => {
      const data = COMPANIONS_DATA.find(cd => cd.id === comp.id);
      if (!data) return;

      const card = document.createElement('div');
      card.className = 'camp-companion-card';

      const trustLevel = comp.trust < 30 ? '低' : comp.trust < 60 ? '中' : comp.trust < 85 ? '高' : '满';
      card.innerHTML = `
        <div style="font-size:24px">${data.icon}</div>
        <div class="camp-companion-name">${data.name}</div>
        <div class="camp-companion-role">${data.role}</div>
        <div class="camp-companion-trust">信任: ${trustLevel}</div>
      `;
      card.onclick = () => showCampDialogue(comp, data);
      compDiv.appendChild(card);
    });
  }

  panel.style.display = 'flex';
}

function showCampDialogue(comp, data) {
  const dlg = document.getElementById('camp-dialogue');
  let text;
  if (comp.trust >= 85) text = data.trust_dialogues.max;
  else if (comp.trust >= 60) text = data.trust_dialogues.high;
  else if (comp.trust >= 30) text = data.trust_dialogues.mid;
  else text = data.trust_dialogues.low;

  dlg.textContent = text;
  dlg.style.display = 'block';

  // Increase trust slightly from talking
  comp.trust = Math.min(100, comp.trust + 3);
}

function restAtCamp() {
  gameState.stamina = Math.min(100, gameState.stamina + 50);
  document.getElementById('camp-panel').style.display = 'none';

  // Anna's singing bonus
  const hasAnna = gameState.companions.find(c => c.id === 'anna');
  if (hasAnna) gameState.stamina = Math.min(100, gameState.stamina + 15);

  // Priest's prayer bonus
  const hasPriest = gameState.companions.find(c => c.id === 'priest_peter');
  if (hasPriest) gameState.stamina = Math.min(100, gameState.stamina + 10);

  showNight();
}

function showNight() {
  gameState.scene = 'night';
  const panel = document.getElementById('night-panel');
  const textEl = document.getElementById('night-text');

  textEl.innerHTML = '';
  textEl.style.animation = 'none';
  void textEl.offsetHeight;
  textEl.style.animation = 'fadeIn 2s ease forwards';
  textEl.textContent = LORE.day_night[gameState.day - 1];

  const btn = document.getElementById('night-continue');
  btn.style.animation = 'none';
  void btn.offsetHeight;
  btn.style.animation = 'fadeIn 1s ease 2s forwards';
  btn.style.opacity = '0';

  panel.style.display = 'flex';
}

function endNight() {
  document.getElementById('night-panel').style.display = 'none';

  // Transition effect
  const trans = document.getElementById('transition');
  trans.classList.add('active');
  setTimeout(() => {
    startNewDay();
    setTimeout(() => trans.classList.remove('active'), 100);
  }, 1000);
}

function showEnding() {
  gameState.scene = 'ending';
  hideAllPanels();
  document.getElementById('hud').style.display = 'none';

  const panel = document.getElementById('ending-panel');

  // Determine ending type
  let endingType = 'mixed';
  if (gameState.totalKindChoices > gameState.totalColdChoices * 2) endingType = 'kind';
  else if (gameState.totalColdChoices > gameState.totalKindChoices) endingType = 'cold';

  document.getElementById('ending-subtitle').textContent = '你到了。';
  document.getElementById('ending-narration').textContent = LORE.endings[endingType];

  // Stats
  const statsDiv = document.getElementById('ending-stats');
  statsDiv.innerHTML = `
    <div class="stat-card">
      <div class="stat-number">${Math.round(gameState.distanceWalked)}</div>
      <div class="stat-label">公里</div>
    </div>
    <div class="stat-card">
      <div class="stat-number">${gameState.totalHelped}</div>
      <div class="stat-label">帮助过的人</div>
    </div>
    <div class="stat-card">
      <div class="stat-number">${gameState.companions.length}</div>
      <div class="stat-label">同行者</div>
    </div>
    <div class="stat-card">
      <div class="stat-number">${Math.round(gameState.food + gameState.water + gameState.medicine)}</div>
      <div class="stat-label">剩余补给</div>
    </div>
  `;

  // Timeline
  const timelineDiv = document.getElementById('ending-timeline');
  timelineDiv.innerHTML = '<div style="font-size:14px;color:#8D6E63;margin-bottom:12px">旅程回顾</div>';
  gameState.choiceLog.forEach(log => {
    timelineDiv.innerHTML += `
      <div class="timeline-day">
        <div class="timeline-dot ${log.kind ? 'kind' : ''}"></div>
        <div class="timeline-text">
          <strong>${DAY_NAMES[log.day - 1]}</strong> · ${log.title}<br>
          <span style="color:#8D6E63">${log.choiceText}</span>
        </div>
      </div>
    `;
  });

  panel.style.display = 'block';
}

function hideAllPanels() {
  ['encounter-panel', 'outcome-panel', 'camp-panel', 'night-panel', 'dawn-panel', 'ending-panel', 'search-prompt', 'companion-info'].forEach(id => {
    document.getElementById(id).style.display = 'none';
  });
}

function updateHUD() {
  document.getElementById('hud-day').textContent =
    DAY_NAMES[Math.min(gameState.day - 1, 6)] + ' · ' + LANDSCAPES[Math.min(gameState.day - 1, 6)].name;

  const weatherIcons = { clear: '☀️', overcast: '☁️', rain: '🌧️', snow: '❄️' };
  const landscape = LANDSCAPES[Math.min(gameState.day - 1, 6)];
  document.getElementById('hud-weather').textContent = weatherIcons[landscape.weather] || '';

  // Supplies
  document.getElementById('hud-supplies').innerHTML = `
    <div class="supply-item"><span class="supply-icon">🍞</span> ${Math.round(gameState.food * 10) / 10}</div>
    <div class="supply-item"><span class="supply-icon">💧</span> ${Math.round(gameState.water * 10) / 10}</div>
    <div class="supply-item"><span class="supply-icon">💊</span> ${Math.round(gameState.medicine * 10) / 10}</div>
  `;

  // Stamina
  document.getElementById('stamina-fill').style.width = gameState.stamina + '%';
  const staminaColor = gameState.stamina > 50 ? '#7CB342' : gameState.stamina > 30 ? '#FFB300' : '#E65100';
  document.getElementById('stamina-fill').style.background = staminaColor;

  // Companions
  const compDiv = document.getElementById('hud-companions');
  compDiv.innerHTML = '';
  gameState.companions.forEach(comp => {
    const data = COMPANIONS_DATA.find(cd => cd.id === comp.id);
    if (!data) return;
    const avatar = document.createElement('div');
    avatar.className = 'companion-avatar';
    avatar.textContent = data.icon;
    avatar.onclick = (e) => {
      e.stopPropagation();
      toggleCompanionInfo(comp, data);
    };
    compDiv.appendChild(avatar);
  });
}

function toggleCompanionInfo(comp, data) {
  const info = document.getElementById('companion-info');
  if (info.style.display === 'block' && info.dataset.id === comp.id) {
    info.style.display = 'none';
    return;
  }
  info.dataset.id = comp.id;
  const trustPct = comp.trust;
  info.innerHTML = `
    <div style="font-size:16px;margin-bottom:4px">${data.icon} ${data.name}</div>
    <div style="font-size:12px;color:#BCAAA4">${data.role}</div>
    <div style="font-size:11px;color:#FFB300;margin-top:4px">${data.skill}</div>
    <div style="font-size:11px;margin-top:6px">信任度</div>
    <div class="trust-bar"><div class="trust-fill" style="width:${trustPct}%"></div></div>
  `;
  info.style.display = 'block';
}

// Close companion info on click elsewhere
document.addEventListener('click', () => {
  document.getElementById('companion-info').style.display = 'none';
});

// ============================================================
// MAIN GAME LOOP
// ============================================================

const particles = new ParticleSystem();
let lastTime = 0;

function gameLoop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  // Clear
  ctx.clearRect(0, 0, W, H);

  if (gameState.scene === 'menu') {
    // Draw menu background on canvas
    drawMenuBackground();
  } else if (gameState.scene !== 'ending') {
    // Draw game world
    const landscape = LANDSCAPES[Math.min(gameState.day - 1, 6)];
    drawLandscape(landscape, gameState.timeOfDay, gameState.scrollX);

    // Mood color overlay
    if (gameState.moodShift > 0.2) {
      ctx.fillStyle = `rgba(255,243,224,${gameState.moodShift * 0.08})`;
      ctx.fillRect(0, 0, W, H);
    } else if (gameState.moodShift < -0.2) {
      ctx.fillStyle = `rgba(207,216,220,${Math.abs(gameState.moodShift) * 0.1})`;
      ctx.fillRect(0, 0, W, H);
    }

    // Update walking
    updateWalking(dt);

    // Particles
    particles.update(dt);
    particles.draw(ctx);

    // Draw companions (behind character)
    let companionX = gameState.charX || W * 0.3;
    gameState.companions.forEach((comp, i) => {
      const data = COMPANIONS_DATA.find(cd => cd.id === comp.id);
      if (data) {
        const cx = companionX - 40 - i * 35;
        const cy = (gameState.charBaseY || H * 0.62) + 5;
        drawCharacter(cx, cy, gameState.walking, data.icon, 0.8);
      }
    });

    // Draw main character
    drawCharacter(
      gameState.charX || W * 0.3,
      gameState.charBaseY || H * 0.62,
      gameState.walking,
      null, 1
    );
  }

  requestAnimationFrame(gameLoop);
}

function drawMenuBackground() {
  // Gentle animated background
  const time = Date.now() * 0.0005;

  // Sky
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
  skyGrad.addColorStop(0, '#EFEBE9');
  skyGrad.addColorStop(0.4, '#BCAAA4');
  skyGrad.addColorStop(1, '#8D8D8D');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);

  // Road
  ctx.strokeStyle = '#A0522D40';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(W * 0.5, H * 0.75);
  ctx.quadraticCurveTo(W * 0.6, H * 0.5, W * 0.8, H * 0.35);
  ctx.stroke();

  // Small figure walking on the road
  const figX = W * 0.55 + Math.sin(time) * 10;
  const figY = H * 0.65 + Math.cos(time) * 3;
  ctx.fillStyle = '#5D4037';
  ctx.fillRect(figX - 2, figY - 8, 4, 8);
  ctx.beginPath();
  ctx.arc(figX, figY - 10, 3, 0, Math.PI * 2);
  ctx.fill();

  // Subtle particles
  ctx.fillStyle = '#9E9E9E30';
  for (let i = 0; i < 10; i++) {
    const px = (i * 173 + Date.now() * 0.01) % W;
    const py = (i * 97 + Date.now() * 0.005) % H;
    ctx.fillRect(px, py, 2, 2);
  }
}

// ============================================================
// EVENT LISTENERS
// ============================================================

document.getElementById('btn-start').onclick = startGame;
document.getElementById('replay-btn').onclick = () => {
  document.getElementById('ending-panel').style.display = 'none';
  document.getElementById('main-menu').style.display = 'flex';
  gameState.scene = 'menu';
};

document.getElementById('dawn-continue').onclick = startWalking;
document.getElementById('outcome-continue').onclick = continueAfterOutcome;
document.getElementById('camp-rest-btn').onclick = restAtCamp;
document.getElementById('night-continue').onclick = endNight;
document.getElementById('search-yes').onclick = doSearch;
document.getElementById('search-no').onclick = skipSearch;

// ============================================================
// START
// ============================================================

requestAnimationFrame(gameLoop);

</script>
